<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Форма задачі</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container py-4">
<h1 th:text="${task.id == null} ? 'Нова задача' : 'Редагувати задачу'">Form</h1>
<form th:action="@{/task/save}" th:object="${task}" method="post" class="row g-3">
  <input type="hidden" th:field="*{id}"/>

  <div class="col-12">
    <label class="form-label">Заголовок</label>
    <input class="form-control" th:field="*{title}" required />
  </div>

  <div class="col-12">
    <label class="form-label">Опис</label>
    <textarea class="form-control" th:field="*{description}"></textarea>
  </div>

  <div class="col-md-4">
    <label class="form-label">Дата</label>
    <input type="date" class="form-control" th:field="*{dueDate}" />
  </div>

  <div class="col-md-4">
    <label class="form-label">Пріоритет</label>
    <select class="form-select" th:field="*{priority}">
      <option th:each="p : ${priorities}"
              th:value="${p}"
              th:text="${p}"
              th:selected="${task.priority == p}">
      </option>
    </select>
  </div>

  <div class="col-md-4 form-check mt-4">
    <input class="form-check-input" type="checkbox" name="done" id="doneCheck"
           th:checked="${task.done}"/>
    <label class="form-check-label" for="doneCheck">Виконано</label>
  </div>

  <div class="col-12">
    <button class="btn btn-primary" type="submit">Зберегти</button>
    <a href="/" class="btn btn-secondary">Скасувати</a>
  </div>
</form>
</body>
</html>
